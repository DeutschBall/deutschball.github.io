site_name: dustland
site_url: https://dustball.top/
site_author: dustball
site_description: 奇怪论调，满口放炮

theme:
  name: material
  language: zh
  favicon: assets/favicon.png
  logo: assets/logo.png
  font:
    text: LXGW WenKai
    code: JetBrains Mono
  palette:

    #暗色
    - scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

    #亮色
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tooltips

extra:
  # true 开启，false 关闭；修改后重新构建/部署生效。
  feature_flags:
    xiangqi: true          # 象棋研究室总开关（含云库、棋谱、名言）
    chess_laboratory: true # 国际象棋研究室
    quotes: true           # 随机名言
    cloud_analysis: true   # 中国象棋云库分析
    chess_library: true    # 我的博客棋谱检索
    home_music: true       # 首页网易云播放器
    floating_music: false  # 全站悬浮音乐播放器
  author: dustball
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeutschBall

markdown_extensions:
  - def_list
  - sane_lists
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.tilde

extra_css:
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
  - stylesheets/custom.css
  - stylesheets/xiangqi.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/xiangqi-loader.js
  - javascripts/chess-laboratory-loader.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


plugins:
  - search
  - chess:
      # 音效可选 chesscom（Chess.com，默认）、tiantian（天天象棋）、lianzhong（联众怀旧版）。
      sounds: lianzhong

      themes:
        xiangqicom: data/chess/themes/xiangqicom/theme.json

      # 按名称选择插件内置棋盘和棋子。省略的选项使用 default。
      defaults:
        xiang:
          # board 可选 default（经典）、wood（木纹）、green（青绿）、
          # tiantian（经典木纹）、xiangqicom（带署名的木纹）、lianzhong（联众怀旧版）。
          board: lianzhong
          # pieces 可选 default（经典）、ivory（象牙白）、ink（墨黑）、wood（木色）、
          # tiantian（灰白）、tiantian-heibai（黑底白字）、tiantian-wood（木质）、
          # xiangqicom（搭配同名棋盘保留署名）、lianzhong（联众怀旧版）。
          pieces: lianzhong

        chess:
          # board 可选 default（经典）、wood（木纹）、green（绿白格）、chesscom（绿白格）。
          board: chesscom
          # pieces 可选 default（经典）、ivory（象牙白与深棕）、ink（黑白）、chesscom（Neo）。
          pieces: chesscom

      # 语言可选 zh（中文）、en（英语）、ru（俄语）、vi（越南语）、
      # ko（韩语）、ja（日语）、de（德语）、fr（法语）。
      language: zh

  - section-index
  - document-dates
  - statistics
  - tags
  - mkdocs-audio

hooks:
  - hooks/feature_flags.py
  - hooks/replay_navigation.py
