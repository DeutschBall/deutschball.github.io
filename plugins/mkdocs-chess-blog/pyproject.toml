[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-chess-plugin"
version = "0.2.2+blog.3"
description = "Playable chess and xiangqi boards in MkDocs from FEN"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mkdocs>=1.6,<2", "Markdown>=3.3", "pymdown-extensions>=10"]

[project.entry-points."mkdocs.plugins"]
chess = "mkdocs_chess_plugin:ChessPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkdocs_chess_plugin = ["assets/*.css", "assets/*.js", "assets/*.mjs", "assets/vendor/*", "assets/themes/*/*"]
